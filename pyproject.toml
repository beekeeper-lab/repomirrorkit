[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-mirror-kit"
version = "0.1.0"
description = "Requirements harvester: analyze a Git repository and emit structured requirement artifacts and a Claude Code project scaffold."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "click>=8.1",
    "structlog>=24.1",
]

[project.scripts]
requirements-harvester = "repo_mirror_kit.harvester.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "anthropic>=0.40",
    # BEAN-071: validate generated OpenAPI documents in tests
    "openapi-spec-validator>=0.7",
]
llm = ["anthropic>=0.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_mirror_kit"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108"]
"tests/integration/conftest.py" = ["S101", "S108", "S603", "S607"]
# BEAN-083: e2e test builds a throwaway git repo; redaction test uses
# secret-shaped literals as fixtures (never real credentials).
"tests/integration/test_pipeline_e2e.py" = ["S101", "S108", "S603", "S607"]
"tests/unit/test_redaction.py" = ["S101", "S105", "S106"]
"src/repo_mirror_kit/services/clone_service.py" = ["S603", "S607"]
"src/repo_mirror_kit/harvester/git_ops.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = [
    "integration: end-to-end harvester pipeline tests against checked-in fixture projects (slower; opt-out with -m 'not integration')",
]
